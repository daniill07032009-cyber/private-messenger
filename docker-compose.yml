services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    environment:
      HTTP_ADDR: ":8080"
    ports: ["8080:8080"]
    restart: unless-stopped
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  web_node_modules:
